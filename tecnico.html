<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPARACEL | Panel de Técnicos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="tecnico">

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <span>REPARA</span>CEL
    </a>
    <div class="topbar-right">
      <a class="link-top" href="pantalla.html" target="_blank">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <span>Pantalla de clientes</span>
      </a>
      <a class="link-top" href="index.html">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
    </div>
  </header>

  <main class="container wide">
    <div class="grid-tec">

      <!-- Registro de técnico -->
      <section class="card">
        <h2>Nuevo Técnico</h2>
        <form id="form-tecnico" novalidate>
          <label for="t-nombre">Nombre Completo</label>
          <input id="t-nombre" maxlength="60" placeholder="Ej. Carlos Mendoza" required>

          <label for="t-cedula">Cédula de Identidad</label>
          <input id="t-cedula" inputmode="numeric" maxlength="10" placeholder="10 dígitos numéricos" required>

          <label>Dispositivos de Especialidad</label>
          <div class="checks">
            <label>
              <input type="checkbox" name="disp" value="celular" checked>
              <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
              <span>Celular</span>
            </label>
            <label>
              <input type="checkbox" name="disp" value="tablet">
              <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
              <span>Tablet</span>
            </label>
            <label>
              <input type="checkbox" name="disp" value="laptop">
              <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>
              <span>Laptop</span>
            </label>
          </div>
          <p class="hint">Los 3 primeros técnicos se ubican en los módulos A, B y C. Desde el 4.º técnico se crea automáticamente un módulo nuevo (D, E, F…).</p>

          <p class="error" id="error-tec" role="alert"></p>
          <button class="btn" type="submit">Registrar Técnico</button>
        </form>

        <h3 class="mt">Técnicos Registrados</h3>
        <ul class="lista-tec" id="lista-tecnicos"></ul>
      </section>

      <!-- Gestión de turnos -->
      <section class="card">
        <div class="card-head">
          <h2>Gestión de Turnos</h2>
          <div class="switch" role="group" aria-label="Modo de cambio de estado">
            <button type="button" id="modo-auto">
              <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              Automático
            </button>
            <button type="button" id="modo-manual">
              <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="14" y2="14"/><line x1="4" x2="20" y1="7" y2="7"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="14" r="2"/><circle cx="12" cy="21" r="2"/></svg>
              Manual
            </button>
          </div>
        </div>

        <p class="hint" id="hint-modo"></p>

        <div class="fila-tec">
          <label for="tec-activo">Técnico activo:</label>
          <select id="tec-activo"></select>
        </div>

        <div class="tabla-wrap">
          <table>
            <thead>
              <tr>
                <th>Turno</th>
                <th>Dispositivo</th>
                <th>Daño</th>
                <th>Técnico</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-gestion"></tbody>
          </table>
        </div>

        <div class="acciones-fila">
          <button class="btn secundario" id="btn-limpiar" type="button">Limpiar finalizados</button>
          <button class="btn peligro" id="btn-reiniciar" type="button">Reiniciar todo</button>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
