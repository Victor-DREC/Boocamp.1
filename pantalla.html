<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPARACEL | Estado de equipos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="pantalla">

  <header class="topbar">
    <a class="brand" href="index.html">🔧 REPARA<span>CEL</span></a>
    <div class="topbar-right">
      <span class="chip" id="chip-modo">Modo: automático</span>
      <span class="reloj" id="reloj">--:--:--</span>
      <a class="link-top" href="index.html">Inicio</a>
    </div>
  </header>

  <main class="container wide">

    <section class="modulos" id="modulos"></section>

    <section class="card">
      <div class="card-head">
        <h2>Estado de los equipos</h2>
        <div class="leyenda">
          <span class="badge espera">En espera</span>
          <span class="badge siguiente">Siguiente</span>
          <span class="badge reparando">Reparando</span>
          <span class="badge listo">Listo</span>
        </div>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr><th>Turno</th><th>Módulo</th><th>Dispositivo</th><th>Cédula</th><th>Hora</th><th>Estado</th></tr>
          </thead>
          <tbody id="tabla-turnos"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
