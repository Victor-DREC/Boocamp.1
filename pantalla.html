<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPARACEL | Estado de Equipos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="pantalla">

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <span>REPARA</span>CEL
    </a>
    <div class="topbar-right">
      <span class="chip" id="chip-modo">Modo: Automático</span>
      <span class="reloj" id="reloj">--:--:--</span>
      <a class="link-top" href="index.html">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
    </div>
  </header>

  <main class="container wide">

    <!-- Tarjetas de módulos con números grandes para alta visibilidad -->
    <section class="modulos" id="modulos"></section>

    <!-- Tabla general de órdenes y estados -->
    <section class="card">
      <div class="card-head">
        <h2>Estado de los Equipos</h2>
        <div class="leyenda">
          <span class="badge espera">En espera</span>
          <span class="badge siguiente">Siguiente</span>
          <span class="badge reparando">Reparando</span>
          <span class="badge listo">Listo</span>
        </div>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Turno</th>
              <th>Módulo</th>
              <th>Dispositivo</th>
              <th>Cédula</th>
              <th>Hora</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-turnos"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
